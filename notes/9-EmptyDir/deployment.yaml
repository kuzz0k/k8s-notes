apiVersion: v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app.kubernetes.io/name: &name app-deployment
    app.kubernetes.io/instance: &instance test
    app.kubernetes.io/version: &version v0.0.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/instance: *instance
      app.kubernetes.io/version: *version
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/instance: *instance
        app.kubernetes.io/version: *version
    spec:
      volumes:
      - name: config-template
        configMap:
          name: app-config
      - name: app-config
        emptyDir: {}
      initContainers:
      - name: config-init
        image: busybox:1.28
        command:
        - sh
        - -c
        - |
          sed -e "s/{{APP_NAME}}/${APP_NAME}/g" \
              -e "s/{{APP_VERSION}}/${APP_VERSION}/g" \
              -e "s/{{DATABASE_URL}}/${DATABASE_URL}/g" \
              /config-template/config-template.txt > /app-config/app-config.txt
              echo "Done"
        env:
        - name: APP_NAME
          value: "my-app"
        - name: APP_VERSION
          value: "v0.0.1"
        - name: DATABASE_URL
          value: "postgresql://localhost/myapp"
        volumeMounts:
        - name: config-template
          mountPath: /config-template
        - name: app-config
          mountPath: /app-config
      containers:
      - name: app-container
        image: nginx:1.19
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app-config
          mountPath: /etc/app-config
          readOnly: true
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"