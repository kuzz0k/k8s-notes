---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-app
  labels: &labels
    app.kubernetes.io/name: stateful-app
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: stateful-app
          image: busybox:1.34
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date -u +%Y-%m-%d_%H:%M:%S)" >> /data/out.txt; 
                sleep 5; 
              done
          volumeMounts:
            - name: data-volume
              mountPath: /data
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: nfs-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-pvc
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Mi
  storageClassName: nfs-client