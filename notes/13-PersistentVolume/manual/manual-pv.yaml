apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pv-01
  labels:
    app.kubernetes.io/name: nfs-storage
    app.kubernetes.io/instance: manual
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /srv/nfs/k3s
    server: 192.168.1.204