---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-https
  namespace: test-gw
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https
      kind: Gateway

  hostnames:
    - testnginx.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: nginx-app-service
          namespace: test-gw
          port: 80