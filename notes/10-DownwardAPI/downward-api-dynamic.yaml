---
apiVersion: v1
kind: Pod
metadata:
  name: downward-api-pod
  labels:
    app.kubernetes.io/name: downward-api-pod
    status: pending
spec:
  containers:
  - name: main
    image: busybox:1.28
    command:
    - sh
    - -c
    - |
      while true; do
        echo "---";
        echo "Reading labels at $(date)";
        cat /etc/podinfo/labels;
        sleep 10;
      done
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
  volumes:
  - name: podinfo
    downwardAPI:
      items:
        path: "labels"
        fieldRef:
          fieldPath: metadata.labels
  restartPolicy: Never