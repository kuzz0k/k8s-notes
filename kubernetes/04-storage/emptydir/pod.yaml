apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
spec:
  containers:
  - name: emptydir-container
    image: busybox:1.28
    command: ["/bin/sh", "-c", "echo Hello Kubernetes! && sleep 3600"]
    volumeMounts:
    - name: emptydir-volume
      mountPath: /usr/share/emptydir
  volumes:
  - name: emptydir-volume
    emptyDir: 
      medium: Memory
      sizeLimit: 100Mi