apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
spec:
  containers:
  - name: hostpath-container
    image: busybox:1.28
    command:
    - /bin/sh
    - -c
    - |
      echo "Hello from the $POD_NAME!" > /data/hostpath-file.txt
      echo "Data written to hostPath volume."
      sleep 3600
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    volumeMounts:
    - name: hostpath-volume
      mountPath: /data
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  volumes:
  - name: hostpath-volume
    hostPath:
      path: /tmp/hostpath-data
    type: DirectoryOrCreate
  restartPolicy: Never