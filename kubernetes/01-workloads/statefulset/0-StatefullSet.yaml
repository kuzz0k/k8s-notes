---
apiVersion: v1
kind: Service
metadata:
  name: test-st
  labels:
    app.kubernetes.io/name: &name test-st
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance test-st
spec:
  selector:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: *version
    app.kubernetes.io/instance: *instance
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: test-st-headless
  labels:
    app.kubernetes.io/name: &name test-st
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance test-st
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: *version
    app.kubernetes.io/instance: *instance
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-st
  labels:
    app.kubernetes.io/name: &name test-st
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance test-st
spec:
  replicas: 3
  podManagementPolicy: Parallel
  serviceName: "test-st-headless"
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/version: *version
      app.kubernetes.io/instance: *instance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/instance: *instance
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.8.0
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "100Mi"
              cpu: "100m"
