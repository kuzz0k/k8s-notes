---
apiVersion: v1
kind: Pod
metadata:
  name: my-pod
  namespace: work
  labels:
    app: nginx
    version: 1.27.5
spec:
  initContainers:
    - name: init-myservice
      image: busybox:1.28
      command: 
      - 'sh'
      - '-c'
      - 'echo The app is running!; sleep 5'
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
  containers:
    - name: nginx
      image: nginx:1.27.5
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 15
        periodSeconds: 20
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10