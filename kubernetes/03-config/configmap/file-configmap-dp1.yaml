---
apiVersion: v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: work
  labels:
    app: &app test
    version: &version 1.27.5
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: *app
        version: *version
    template:
      metadata:
        labels:
          app: *app
          version: *version
      spec:
        volumes:
          - name: test-volume
            configMap:
              name: test-configmap
        containers:
          - name: main
            image: busybox:1.28
            command: ["/bin/sh", "-c", "tail -f /dev/null"]
            volumeMounts:
              - name: test-volume
                mountPath: /etc/test
            ports:
              - containerPort: 80
                name: http
                protocol: TCP
            resources:
              limits:
                cpu: "100m"
                memory: "10Mi"
              requests:
                cpu: "100m"
                memory: "100Mi"
            livenessProbe:
              httpGet: