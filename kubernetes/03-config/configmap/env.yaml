---
apiVersion: v1
kind: Deployment
metadata:
  name: test-deployment
  labels:
    app.kubernetes.io/name: &name test-deployment
    app.kubernetes.io/version: &version v0.0.1
    app.kubernetes.io/instance: &instance test-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/version: *version
      app.kubernetes.io/instance: *instance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/version: *version
        app.kubernetes.io/instance: *instance
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "100m"
              memory: "10Mi"
            requests:
              cpu: "100m"
              memory: "100Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
              initialDelaySeconds: 5
              periodSeconds: 10
          env:
            - name: TEST_ENV
              key: test-value
            - name: TEST_PORT
              valueFrom:
                configMapKeyRef:
                  name: test-configmap
                  key: TEST_PORT
          envFrom:
            - configMapRef:
                name: test-configmap
