---
apiVersion: v1
kind: Pod
metadata:
  name: downward-api-volume-demo
  labels:
    app.kubernetes.io/name: downward-api-volume-demo
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
  annotations:
    author: "John Doe"
spec:
  containers:
  - name: main
    image: busybox:1.28
    command:
    - sh
    - -c
    - |
      echo "POD_NAME: $(cat /etc/podinfo/pod_name)"
      echo "POD_NAMESPACE: $(cat /etc/podinfo/pod_namespace)"
      echo "POD_IP: $(cat /etc/podinfo/pod_ip)"
      echo "NODE_NAME: $(cat /etc/podinfo/node_name)"
      echo "APP_LABEL: $(cat /etc/podinfo/app_label)"
      echo "SERVICE_ACCOUNT: $(cat /etc/podinfo/service_account)"
      echo "ANNOTATION_AUTHOR: $(cat /etc/podinfo/annotation_author)"
      echo "CPU_LIMIT: $(cat /etc/podinfo/cpu_limit)"
      echo "MEM_LIMIT: $(cat /etc/podinfo/mem_limit)"
      sleep infinity
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
  volumes:
  - name: podinfo
    downwardAPI:
      items:
      # Pod fields
      - path: pod_name
        fieldRef:
          fieldPath: metadata.name
      - path: pod_namespace
        fieldRef:
          fieldPath: metadata.namespace
      - path: pod_ip
        fieldRef:
          fieldPath: status.podIP
      - path: node_name
        fieldRef:
          fieldPath: spec.nodeName
      # Container fields
      - path: cpu_limit
        resourceFieldRef:
          containerName: main
          resource: limits.cpu
          divisor: "1"
      - path: mem_limit
        resourceFieldRef:
          containerName: main
          resource: limits.memory
          divisor: 1Mi