---
apiVersion: v1
kind: Pod
metadata:
  name: downward-api-env-demo
  labels:
    app.kubernetes.io/name: downward-api-env-demo
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  containers:
  - name: main
    image: busybox:1.28
    command:
    - sh
    - -c
    - |
      echo "POD_NAME: $POD_NAME"
      echo "POD_NAMESPACE: $POD_NAMESPACE"
      echo "POD_IP: $POD_IP"
      echo "NODE_NAME: $NODE_NAME"
      echo "APP_LABEL: $APP_LABEL"
      echo "SERVICE_ACCOUNT: $SERVICE_ACCOUNT"
      sleep inifinity
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: APP_LABEL
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['app.kubernetes.io/instance']
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
  restartPolicy: Never