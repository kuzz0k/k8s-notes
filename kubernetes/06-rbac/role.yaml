---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: test # ns к которому применяются ограничения
  name: user-role-1
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matthew-rb
  namespace: test
subjects:
- kind: User
  name: matthew
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: user-role-1
  apiGroup: rbac.authorization.k8s.io
